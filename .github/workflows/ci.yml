name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # Every PR gets a Vercel preview URL. Requires VERCEL_TOKEN,
  # VERCEL_ORG_ID, VERCEL_PROJECT_ID as repo secrets — see README.md.
  #
  # Deploys via Vercel's own CLI (installed fresh, always current)
  # rather than a third-party action — amondnet/vercel-action pins a
  # multi-year-old CLI version that no longer talks to Vercel's current
  # API correctly.
  #
  # Runs from the repo root, not apps/web — the chosn-web project has
  # its own Root Directory set to apps/web on Vercel's side, and the
  # CLI expects to be invoked from the repo root so it can apply that
  # setting itself. cd'ing into apps/web first doubles the path into
  # apps/web/apps/web, which doesn't exist.
  preview:
    name: Deploy preview
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  # Day 27 — develop's own deploy, no approval gate (that's the whole
  # point of a staging tier: verify freely before the real gate on
  # main). Same `vercel deploy --prebuilt` CLI flow as preview/
  # production, `--environment=preview` (not `--prod`) — Vercel scopes
  # env vars by Production/Preview/Development, so this picks up
  # whatever's set under "Preview" (see PROMOTION.md for what that
  # should point at: the Railway staging API, not production).
  #
  # Deliberately not the `staging.chosn.app` domain an earlier version
  # of this file assumed would exist (see README's CI/CD section) —
  # Vercel auto-assigns a stable git-branch-alias URL
  # (chosn-web-git-develop-<team>.vercel.app) to any branch it deploys
  # via the CLI with git metadata present, which this job gets for free
  # from actions/checkout@v7's full clone. No custom domain needed to
  # get a bookmarkable staging URL on the Hobby plan.
  deploy-staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  # main deploys straight to the live production URL, but only after a
  # human approves it — see the `production` GitHub Environment's
  # required-reviewer setting in README.md.
  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
