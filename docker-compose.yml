services:
  postgres:
    image: postgres:16-alpine
    # Docker's default 64 MB /dev/shm runs out when many parallel queries run at once ("could not resize shared memory segment")
    shm_size: 512mb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chosn_dev
    ports:
      # Host port 55432 — this machine has native Windows PostgreSQL
      # services (v13 and v18) already occupying both 5432 and 5433.
      # Container-internal port is untouched, so DATABASE_URL below
      # just points at 55432.
      # 127.0.0.1 only: published as '55432:5432' it listened on every network interface (SEC-12).
      - '127.0.0.1:55432:5432'
    volumes:
      - chosn-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host port 6380, not 6379 — this machine already has another
      # project's Redis bound to 6379. Container-internal port is
      # untouched, so REDIS_URL below just points at 6380.
      - '127.0.0.1:6380:6379'

volumes:
  chosn-postgres:
